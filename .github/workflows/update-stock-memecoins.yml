name: Update stock-paired memecoins table

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-stock-memecoins
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh table values
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/update_stock_memecoins.py

      - name: Commit the refreshed snapshot
        run: |
          git add _data/stock_memecoins.json _posts/2026-10-10-stock-paired-memecoins-crypto-beneficiaries.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh stock-paired memecoins table"
          git pull --rebase origin main
          git push origin HEAD:main

      # GITHUB_TOKEN commits do not automatically trigger branch-based Pages builds.
      - name: Rebuild GitHub Pages after the refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
